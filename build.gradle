plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()

	// Backup Central mirror: the local dev mirror and shared CI egress IPs are rate-limited or
	// partial; this keeps plain Central artifacts (e.g. ArchUnit) resolvable in both places.
	maven {
		name = 'CentralAliyunMirror'
		url = 'https://maven.aliyun.com/repository/central'
	}

	// Modrinth maven — Iris (compile-only bridge for the Mirror Dimension ability)
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup('maven.modrinth')
		}
	}

	// Veil (Foundry) — render framework for the experimental shader layer
	maven {
		name = 'BlameJared'
		url = 'https://maven.blamejared.com'
	}

	// Architectury maven — architectury-api dep required by photon
	maven {
		name = 'Architectury'
		url = 'https://maven.architectury.dev/'
	}

	// Fabric maven — fabric-language-kotlin (hard dep of ldlib2)
	maven {
		name = 'FabricMC'
		url = 'https://maven.fabricmc.net/'
	}

	// Jitpack — taffy / yoga, UI libraries bundled inside ldlib2
	maven {
		name = 'Jitpack'
		url = 'https://jitpack.io/'
	}

	exclusiveContent {
		forRepository {
			maven {
				name = 'GeckoLib'
				url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
			}
		}
		filter {
			includeGroup('software.bernie.geckolib')
		}
	}
}

sourceSets {
	main {
		resources {
			srcDirs += [
				'src/main/generated'
			]
		}
	}
	// Server GameTests run against the real mod; never packaged (auditReleaseJarIsolation enforces it).
	gametest {
		compileClasspath += main.compileClasspath + main.output
		// Veil hard-depends on client-only Fabric modules, so it cannot load on a dedicated server.
		runtimeClasspath += main.runtimeClasspath.filter { !it.path.contains('veil') } + main.output
	}
	// Datagen runs a server environment: same Veil exclusion as the GameTest classpath.
	datagen {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath.filter { !it.path.contains('veil') } + main.output
	}
	// Veil-free client run: Veil FX code paths are guarded by isModLoaded("veil"),
	// so runtime checks without Veil need a classpath that simply lacks the jar.
	// loom creates the split-env 'client' source set after this block evaluates,
	// hence the eager empty set here and the lazy classpath below.
	clientnoveil
	// Veil-free dedicated-server run: Veil hard-depends on client-only Fabric
	// modules, so it can never load in a server env — same exclusion as gametest.
	servernoveil
}

afterEvaluate {
	sourceSets.clientnoveil.compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
	sourceSets.clientnoveil.runtimeClasspath += sourceSets.client.runtimeClasspath.filter { !it.path.contains('veil') } + sourceSets.client.output + sourceSets.main.output
	// servernoveil has no sources of its own; it exists purely as a filtered classpath.
	sourceSets.servernoveil.compileClasspath += sourceSets.main.compileClasspath
	sourceSets.servernoveil.runtimeClasspath += sourceSets.main.runtimeClasspath.filter { !it.path.contains('veil') } + sourceSets.main.output
}

// JUnit covers pure client-side state too (Client*State session resets, cooldown clocks —
// audit B15): give the test source set the client classes and their compile classpath
// (mapped Minecraft + LWJGL/GLFW) so they load and link. Runs after loom's
// splitEnvironmentSourceSets() has created the 'client' source set.
afterEvaluate {
	sourceSets.test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

// ============================================================================
// Dev-only MCP companion: a second mod, codex-mcpdev, compiled from src/mcpdev
// against BOTH our main output and the upstream MCP server jar. Fully dormant
// without -PmcpUpstreamJar=<path> (every mcpdev task skips), so normal builds
// never need the upstream jar. The coupling direction is mcpdev -> {main,
// upstream}; production classes gain zero MCP imports.
// ============================================================================
def mcpUpstreamJar = providers.gradleProperty('mcpUpstreamJar').orNull
def mcpCompanionEnabled = mcpUpstreamJar != null && !mcpUpstreamJar.isBlank()

sourceSets {
	// Default conventions already map this set to src/mcpdev/{java,resources};
	// adding srcDir would register the same directory twice and duplicate every
	// resource entry (processMcpdevResources fails on the doubled fabric.mod.json).
	mcpdev {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
	}
}

// The Java plugin only creates jar tasks for the main source set; the companion's
// jar is explicit. Skipped like every other mcpdev task without -PmcpUpstreamJar.
tasks.register('jarMcpdev', Jar) {
	group = 'build'
	description = 'Assembles the dev-only codex-mcpdev companion jar'
	dependsOn tasks.named('mcpdevClasses')
	from sourceSets.mcpdev.output
	archiveFileName = "superheroes-mcpdev-${project.version}.jar"
}

tasks.named('assemble') {
	dependsOn tasks.named('jarMcpdev')
}

if (mcpCompanionEnabled) {
	dependencies {
		mcpdevCompileOnly files(mcpUpstreamJar)
		// The upstream API surface is Jackson types (JsonNode, ObjectNode); at runtime
		// they come from the MCP mod's bundled jar-in-jar copies, so compile-only here.
		mcpdevCompileOnly "com.fasterxml.jackson.core:jackson-databind:2.22.1"
		mcpdevCompileOnly "com.fasterxml.jackson.core:jackson-core:2.22.1"
		mcpdevCompileOnly "com.fasterxml.jackson.core:jackson-annotations:2.22"
	}
}

// No property -> the whole source set is dormant: assemble stays green with the
// mcpdev tasks skipped instead of failing on a missing upstream jar.
tasks.matching { it.name.toLowerCase().contains('mcpdev') }.configureEach {
	onlyIf { mcpCompanionEnabled }
}

tasks.named('processMcpdevResources') {
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"superheroes" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"superheroes-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// runServer must boot without Veil: it lives on the filtered
		// servernoveil classpath (client-only Fabric modules can't resolve
		// in a dedicated-server env). datagen/gametest already filter Veil.
		server {
			source sourceSets.servernoveil
		}
		datagen {
			inherit server
			source sourceSets.datagen
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=superheroes"
			runDir "build/datagen"
		}
		// Headless GameTest server: exits with the number of failed required tests.
		gametest {
			server()
			name "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/junit.xml")}"
			runDir "build/gametest"
		}
		// Veil-free client (see the clientnoveil source set): exercises the
		// isModLoaded("veil") fallback paths for hero FX.
		clientNoVeil {
			client()
			name "Client (no Veil)"
			source sourceSets.clientnoveil
			runDir "build/clientnoveil"
		}
	}
}


dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib — 3D animated models (horde mobs render via GeckoLib geo/animations).
	// Bundled (jar-in-jar) so the shipped jar is self-contained: the mod now
	// HARD-requires GeckoLib at runtime (BaseHordeEntity implements GeoEntity).
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21:4.5.8"
	include "software.bernie.geckolib:geckolib-fabric-1.21:4.5.8"

	// Veil — render framework powering Scorpion's shader FX (Quasar particles, bloom, dynamic light).
	// Optional at runtime: code is guarded by FabricLoader.isModLoaded("veil").
	modImplementation "foundry.veil:veil-fabric-1.21.1:${project.veil_version}"

	// Iris — compile-only: Mirror Dimension toggles the victim's Acid shaderpack.
	// NOT bundled, NOT required at runtime; guarded by FabricLoader.isModLoaded("iris").
	modCompileOnly "maven.modrinth:iris:1.8.8+1.21.1-fabric"

	// EMF + ETF — custom player model + animation for Homelander's EMF presentation.
	// Bundled (jar-in-jar, same mechanism as GeckoLib): fabric.mod.json hard-depends on
	// entity_model_features on the client; on the dedicated server the nested client-only
	// mods land in envDisabledMods and the dep softens to suggests (verified vs
	// fabric-loader ModResolver/ModSolver). ETF is pulled by EMF's own depends.
	modImplementation "maven.modrinth:entity-model-features:3.3.9-fabric-1.21"
	include "maven.modrinth:entity-model-features:3.3.9-fabric-1.21"
	modImplementation "maven.modrinth:entitytexturefeatures:7.2.4-fabric-1.21"
	include "maven.modrinth:entitytexturefeatures:7.2.4-fabric-1.21"

	// Photon — particle/beam/trail FX engine driving the VFXLab-authored .fx resources used
	// by the Regulus VFX rework. photon/ldlib2 are local intermediary-mapped builds from
	// grebeshok105/Photon (branch 1.21.1-fabric-2.2); `include` bundles all four jars into
	// META-INF/jars so the shipped jar is self-contained. Hard-required at runtime; render
	// code stays behind client guards.
	modImplementation files(
			"libs/photon-fabric-1.21.1-2.2.7.jar",
			"libs/ldlib2-fabric-1.21.1-2.7.jar",
			"libs/kilagraph-fabric-1.21.1-21.1.0.15.jar")
	// ldlib2's fabric.mod.json hard-requires fabric-language-kotlin at runtime.
	modRuntimeOnly "net.fabricmc:fabric-language-kotlin:1.12.3+kotlin.2.0.21"
	// Loom's dev classpath doesn't surface jars nested inside file deps, so the libraries
	// ldlib2/FCAP ship in their own META-INF/jars must sit on the classpath directly
	// (same versions as the nested copies — the release jar gets them via the nesting).
	implementation "dev.vfyjxf:taffy:1.1.4"
	implementation "org.appliedenergistics.yoga:yoga:1.0.0"
	implementation "com.electronwill.night-config:core:3.8.0"
	implementation "com.electronwill.night-config:toml:3.8.0"
	modImplementation "dev.architectury:architectury-fabric:13.0.8"
	include "dev.architectury:architectury-fabric:13.0.8"
	// Forge Config API Port (ModConfigSpec) — same coordinates the photon build uses.
	modImplementation "maven.modrinth:forge-config-api-port:v21.1.6-1.21.1-Fabric"
	include "maven.modrinth:forge-config-api-port:v21.1.6-1.21.1-Fabric"

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "com.tngtech.archunit:archunit-junit5:1.5.1"
}

// Local-file jar-in-jar for photon/ldlib2 (`include` rejects non-module file deps).
// `from` copies the jar itself — zipTree would explode it; the nested jars land in
// META-INF/jars where fabric resolves them as real mods (photon's own nested
// kilagraph comes free with it).
jar {
	into('META-INF/jars') {
		from 'libs/photon-fabric-1.21.1-2.2.7.jar', 'libs/ldlib2-fabric-1.21.1-2.7.jar'
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// A JUnit run that discovers nothing is a silent pass, not a green check.
	failOnNoDiscoveredTests = true
}

tasks.named('test') {
	dependsOn tasks.named('clientClasses')
	systemProperty 'codex.mainClasses', sourceSets.main.output.classesDirs.asPath
	systemProperty 'codex.clientClasses', sourceSets.client.output.classesDirs.asPath
	// One-off baseline creation: -Darchunit.freeze.store.default.allowStoreCreation=true -Dcodex.writeCycleBaseline=true
	systemProperties System.properties.findAll { it.key.toString().startsWith('archunit.') || it.key.toString().startsWith('codex.write') }
	// fileTree tolerates a missing directory; inputs.dir(...).optional() does not (Gradle 9.4.1 fails before JUnit starts).
	inputs.files(fileTree('src/test/resources/archunit_store')).withPropertyName('archunitStore')
}

// ============================================================================
// Verification gate (ported from jujutsu-minecraft, adapted to this codebase:
// no GameTest lane, no doc audit — those do not exist here yet).
// ============================================================================

tasks.register('testProjectSanity', JavaExec) {
	group = 'verification'
	description = 'Runs resource, seam and side-separation sanity checks'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.grebeshok105.codex.ProjectSanityTest'
	maxHeapSize = '128m'
	jvmArgs '-ea'
}

// `check` pulls every verification-group JavaExec alongside JUnit, so future sanity
// programs join the gate just by registering with the same group.
tasks.named('check') {
	dependsOn tasks.withType(JavaExec).matching {
		it.group == 'verification'
	}
}

// Assertion programs are plain main() classes guarded by `assert`; a task that forgets
// -ea passes unconditionally, forever, in silence. Reads the real Gradle task model, so
// a task registered from anywhere is still covered.
tasks.register('verifyAssertionsEnabled') {
	group = 'verification'
	description = 'Fails if any verification JavaExec task would run with assertions disabled'
	doLast {
		// Realized into a plain list: DomainObjectCollection.findAll(Closure) is removed in Gradle 10.
		def programs = tasks.withType(JavaExec).matching { it.group == 'verification' }.toList()
		def offenders = programs.findAll { program -> !enablesAssertions(program) }
				.collect { it.name }
				.toSorted()
		if (!offenders.isEmpty()) {
			throw new GradleException(
					'These verification JavaExec tasks run with assertions disabled, so every assert inside them\n'
							+ 'is skipped and the task passes unconditionally:\n'
							+ offenders.collect { "  - ${it}" }.join('\n')
							+ "\nGive each one `jvmArgs '-ea'` or `enableAssertions = true`.")
		}
		logger.lifecycle("verifyAssertionsEnabled: ${programs.size()} verification JavaExec tasks all enable assertions")
	}
}

// True when this program will actually evaluate its `assert` statements, by either route the JVM offers.
static boolean enablesAssertions(JavaExec program) {
	if (program.enableAssertions) {
		return true
	}
	return program.jvmArgs.any { String arg ->
		arg == '-ea' || arg == '-enableassertions' || arg.startsWith('-ea:') || arg.startsWith('-enableassertions:')
	}
}

// The release jar must not leak test-only or dev-only content. Scans the remapped jar's
// OUTER entries only — bundled jar-in-jar deps (GeckoLib) are opaque to this audit;
// if jar-in-jar scanning is ever needed, this audit must learn to open nested jars.
tasks.register('auditReleaseJarIsolation') {
	group = 'verification'
	description = 'Fails when the release jar leaks test-only or dev-only content'
	dependsOn tasks.named('remapJar')
	doLast {
		File jarFile = tasks.remapJar.archiveFile.get().asFile
		def offenders = []
		int entryCount = 0
		boolean sawRootPackage = false
		def rootDescriptorText = null

		new java.util.zip.ZipFile(jarFile).withCloseable { java.util.zip.ZipFile zip ->
			for (java.util.zip.ZipEntry entry : Collections.list(zip.entries())) {
				String name = entry.name
				entryCount++
				if (name.startsWith('io/github/grebeshok105/codex/')) {
					sawRootPackage = true
				}
				if (name.startsWith('com/example/')) {
					offenders << "${name}  (class under the retired legacy root package)"
				}
				if (name.startsWith('org/junit/') || name.startsWith('org/jopentest4j/')
						|| name.startsWith('org/apiguardian/')) {
					offenders << "${name}  (test-only JUnit classes)"
				}
				if (name.contains('gametest') || name.startsWith('net/fabricmc/fabric/api/gametest/')) {
					offenders << "${name}  (test-only gametest content)"
				}
				if (name == 'fabric.mod.json') {
					if (rootDescriptorText != null) {
						offenders << "${name}  (second fabric.mod.json descriptor beyond the root one)"
					} else {
						rootDescriptorText = zip.getInputStream(entry).getText('UTF-8')
					}
				}
			}

			if (rootDescriptorText != null) {
				def descriptor = new groovy.json.JsonSlurper().parseText(rootDescriptorText)
				if (descriptor.id != 'superheroes') {
					offenders << "fabric.mod.json  (root descriptor id is '${descriptor.id}', expected 'superheroes')"
				}
				if (descriptor.entrypoints instanceof Map
						&& (descriptor.entrypoints.containsKey('fabric-gametest')
								|| descriptor.entrypoints.containsKey('fabric-client-gametest'))) {
					offenders << "fabric.mod.json  (fabric-gametest / fabric-client-gametest entrypoints present)"
				}
			}
		}

		if (!sawRootPackage) {
			offenders << "(no entries under io/github/grebeshok105/codex/ — mod root package missing from jar)"
		}

		if (!offenders.isEmpty()) {
			throw new GradleException(
					'Release jar leaks test-only or dev-only content: ' + jarFile.absolutePath + '\n'
							+ offenders.collect { "  - ${it}" }.join('\n'))
		}
		logger.lifecycle("auditReleaseJarIsolation: ${jarFile.name}: ${entryCount} entries scanned, no test-only or dev-only content")
	}
}

// ArchUnit removes fixed violations from the store while tests run; an uncommitted shrink would let the
// same violation return later, so the gate requires the store to match what is committed.
tasks.register('verifyArchitectureBaseline') {
	group = 'verification'
	description = 'Fails when the frozen ArchUnit baseline differs from the committed one'
	dependsOn tasks.named('test')
	doLast {
		def status = providers.exec {
			commandLine 'git', 'status', '--porcelain', '--', 'src/test/resources/archunit_store', 'src/test/resources/architecture'
		}.standardOutput.asText.get().trim()
		if (!status.isEmpty()) {
			throw new GradleException("Architecture baseline changed — review and commit it:\n" + status)
		}
	}
}

// The one command. Nothing may be called verified without a green run of this task.
// `build` already carries assemble + check (compile, JUnit, verification JavaExecs);
// the gate adds the post-build audits on top.
tasks.register('qualityGate') {
	group = 'verification'
	description = 'The merge gate: full build with tests plus post-build audits'
	dependsOn tasks.named('build')
	dependsOn tasks.named('verifyAssertionsEnabled')
	dependsOn tasks.named('auditReleaseJarIsolation')
	dependsOn tasks.named('runGametest')
	dependsOn tasks.named('verifyArchitectureBaseline')
	dependsOn tasks.named('verifyGeneratedSources')
}

// Datagen must run inside the gate: registry bootstrap bugs (e.g. a damage type
// registered twice on one BootstrapContext) crash only here, never at gametest
// time. The follow-up porcelain check then pins src/main/generated to the
// generator's current output so stale or hand-edited files fail the merge.
tasks.register('verifyGeneratedSources') {
	group = 'verification'
	description = 'Runs datagen and fails when src/main/generated differs from committed output'
	dependsOn tasks.named('runDatagen')
	doLast {
		def status = providers.exec {
			commandLine 'git', 'status', '--porcelain', '--', 'src/main/generated'
		}.standardOutput.asText.get().trim()
		if (!status.isEmpty()) {
			throw new GradleException("src/main/generated drifted — re-run ./gradlew runDatagen and commit the result:\n" + status)
		}
	}
}

// A stale world from an earlier run would leak players and state between GameTest runs.
tasks.named('runGametest') {
	doFirst {
		delete file('build/gametest/world')
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}